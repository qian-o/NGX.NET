name: Update NGX

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-ngx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Resolve and verify one official SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/build_ngx.py prepare --root "${{ runner.temp }}/sdk"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ngx-sdk
          path: ${{ runner.temp }}/sdk
          compression-level: 0
          retention-days: 3

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
            arch: x64
          - rid: win-arm64
            runner: windows-2022
            arch: arm64
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: ngx-sdk
          path: ${{ runner.temp }}/sdk
      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=${{ matrix.arch }} -host_arch=x64'
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
              "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: Install extraction dependency
        run: python -m pip install libclang==18.1.1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Extract, link and verify
        run: python .github/scripts/build_ngx.py build --root "${{ runner.temp }}/sdk" --scratch "${{ runner.temp }}/build" --output "${{ runner.temp }}/result" --rid ${{ matrix.rid }}
      - name: Publish and exercise the NativeAOT binding
        run: python .github/scripts/build_ngx.py smoke --root . --scratch "${{ runner.temp }}/aot" --output "${{ runner.temp }}/result" --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ngx-${{ matrix.rid }}
          path: ${{ runner.temp }}/result
          if-no-files-found: warn
          retention-days: 7

  update:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v5
        with:
          pattern: ngx-*-*
          path: ${{ runner.temp }}/artifacts
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Merge the four verified targets
        shell: bash
        run: |
          for rid in win-x64 win-arm64 linux-x64 linux-arm64; do
            mv "${{ runner.temp }}/artifacts/ngx-$rid" "${{ runner.temp }}/artifacts/$rid"
          done
          python .github/scripts/build_ngx.py merge --root "${{ runner.temp }}/artifacts" --output .
      - name: Regenerate and independently verify the compiled API
        run: |
          dotnet run --project NGX.NET.Generator -- .
          dotnet build NGX.NET.slnx -c Release -warnaserror -p:GeneratePackageOnBuild=false
          dotnet run .github/scripts/verify_ngx.cs -- .
          dotnet pack NGX.NET -c Release --no-build
          python .github/scripts/build_ngx.py verify-package --root .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ngx-update
          path: |
            native/
            NGX.NET.Generator/ast.json
            NGX.NET/**/*.g.cs
          compression-level: 0
          retention-days: 7
      - name: Commit the complete update to the triggering branch
        env:
          NGX_BRANCH: ${{ github.ref_name }}
          NGX_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$NGX_HEAD"
          git add native NGX.NET.Generator/ast.json NGX.NET
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update NGX SDK and all native runtimes'
          git push origin "HEAD:refs/heads/$NGX_BRANCH"

name: Extract Streamline API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extract-streamline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure Windows C++ headers
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('INCLUDE', 'LIB', 'VCToolsVersion', 'WindowsSDKVersion')) {
              "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }

      - name: Install extraction dependency
        run: python -m pip install libclang==18.1.1

      - name: Extract current official release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/extract_streamline.py --scratch "${{ runner.temp }}/streamline-extraction" --output Streamline.NET.Generator/streamline-ast.json

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: streamline-ast
          path: Streamline.NET.Generator/streamline-ast.json
          if-no-files-found: error
          retention-days: 7

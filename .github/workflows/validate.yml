name: Validate wrapper

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Rebuild the committed generated sources
        run: dotnet run --project Streamline.NET.Generator -c Release -- .

      - name: Verify offline regeneration is unchanged
        run: git diff --exit-code -- Streamline.NET Streamline.NET.Generator

      - name: Build Debug and Release with warnings as errors
        run: |
          dotnet build Streamline.NET.slnx -c Debug --warnaserror
          dotnet build Streamline.NET.slnx -c Release --warnaserror

      - name: Validate layouts and managed behavior
        run: dotnet run --project .github/validation/WrapperChecks.csproj -c Release -- .

      - name: Publish AOT and trimmed consumer
        run: dotnet publish .github/aot-smoke/AotSmoke.csproj -c Release -r win-x64 -o artifacts/aot --warnaserror

      - name: Run the AOT consumer without an SDK runtime
        run: ./artifacts/aot/AotSmoke.exe

      - name: Build an isolated NuGet consumer
        run: python .github/scripts/verify_package.py

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Streamline.NET-managed-package
          path: Streamline.NET/bin/Release/*.nupkg
          if-no-files-found: error
          retention-days: 7
